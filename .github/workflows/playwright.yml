name: Playwright Tests

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main


jobs:
  test:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4


      - name: Start Docker containers
        run: |
          docker compose up -d


      - name: Check Docker containers
        run: |
          docker compose ps


      - name: Check OpenCart files
        run: |
          docker exec opencart-app ls -la /var/www/html


      - name: Wait for MySQL
        run: |
          echo "Waiting for MySQL..."

          for i in {1..30}; do
            if docker exec opencart-db mysqladmin ping -h localhost -uopencart -popencart --silent; then
              echo "MySQL is ready!"
              exit 0
            fi

            echo "Waiting..."
            sleep 5
          done

          echo "MySQL failed to start"
          docker logs opencart-db
          exit 1


      - name: Import database
        run: |
          docker exec -i opencart-db mysql \
          -uopencart \
          -popencart \
          opencart < opencart.sql


      - name: Verify database
        run: |
          docker exec opencart-db mysql \
          -uopencart \
          -popencart \
          opencart \
          -e "SHOW TABLES;"


      - name: Restart OpenCart
        run: |
          docker restart opencart-app
          sleep 10


      - name: Wait for OpenCart
        run: |
          echo "Waiting for OpenCart..."

          for i in {1..30}; do

            if curl -s http://localhost:8080/ | grep -q "Your Store"; then
              echo "OpenCart is ready!"
              exit 0
            fi

            echo "Waiting for OpenCart..."
            sleep 5
          done


          echo "OpenCart failed to start"

          docker logs opencart-app
          exit 1


      - name: Debug OpenCart page
        run: |
          echo "Checking page title..."
          curl -s http://localhost:8080/ | grep -i "<title>"


      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20


      - name: Install dependencies
        run: npm ci


      - name: Install Playwright browsers
        run: npx playwright install --with-deps


      - name: Run Playwright tests
        env:
          BASE_URL: http://localhost:8080/
          CI: true
        run: npx playwright test


      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/


      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results/


      - name: Show Docker logs on failure
        if: failure()
        run: |
          echo "=== OpenCart logs ==="
          docker logs opencart-app

          echo "=== MySQL logs ==="
          docker logs opencart-db


      - name: Stop containers
        if: always()
        run: |
          docker compose down