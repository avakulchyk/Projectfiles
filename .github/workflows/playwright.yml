# Updated Workflow
name: Playwright Tests

on:
  workflow_dispatch:

  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Start Docker containers
        run: |
          docker compose up -d --build

      - name: Check Docker containers
        run: |
          docker compose ps

      - name: Wait for MySQL
        run: |
          echo "Waiting for MySQL..."

          for i in {1..30}; do
            if docker exec opencart-db mysqladmin ping \
              -h localhost \
              -uopencart \
              -popencart \
              --silent; then
              echo "MySQL is ready!"
              exit 0
            fi

            echo "Waiting for MySQL..."
            sleep 5
          done

          echo "MySQL failed to start"
          docker logs opencart-db
          exit 1

      - name: Import database
        run: |
          docker exec -i opencart-db mysql \
            -uopencart \
            -popencart \
            opencart < opencart.sql

      - name: Verify test users
        run: |
          echo "Checking test users..."

          docker exec opencart-db mysql \
            -uopencart \
            -popencart \
            opencart \
            -e "
              SELECT customer_id, firstname, lastname, email, date_added
              FROM oc_customer
              WHERE email IN (
                'change.password@test.com',
                'lock.test@test.com',
                'vakulchykanastasiia@gmail.com'
              );
            "

      - name: Check password hash before tests
        run: |
          echo "=== Password hash BEFORE Playwright tests ==="

          docker exec opencart-db mysql \
            -uopencart \
            -popencart \
            opencart \
            -e "
              SELECT customer_id, email, password
              FROM oc_customer
              WHERE email = 'change.password@test.com';
            "

      - name: Verify database
        run: |
          echo "Checking OpenCart database..."

          docker exec opencart-db mysql \
            -uopencart \
            -popencart \
            opencart \
            -e "SHOW TABLES;" | grep oc_store

          echo "Database is ready!"

      - name: Fix OpenCart permissions
        run: |
          docker exec opencart-app bash -c "
            mkdir -p /var/www/html/system/storage/cache
            mkdir -p /var/www/html/system/storage/logs
            mkdir -p /var/www/html/system/storage/session

            chown -R www-data:www-data /var/www/html/system/storage
            chown -R www-data:www-data /var/www/html/image

            chmod -R 775 /var/www/html/system/storage
            chmod -R 775 /var/www/html/image
          "

      - name: Restart OpenCart
        run: |
          docker restart opencart-app
          sleep 10

      - name: Check OpenCart files
        run: |
          docker exec opencart-app ls -la /var/www/html

      - name: Wait for OpenCart
        run: |
          echo "Waiting for OpenCart..."

          for i in {1..30}; do
            TITLE=$(curl -s http://localhost:8080/ | grep -i "<title>")

            echo "Current title: $TITLE"

            if echo "$TITLE" | grep -qi "Your Store"; then
              echo "OpenCart is ready!"
              exit 0
            fi

            echo "Waiting for OpenCart..."
            sleep 5
          done

          echo "OpenCart failed"

          echo "=== OpenCart logs ==="
          docker logs opencart-app

          exit 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: |
          npm ci

      - name: Install Playwright browsers
        run: |
          npx playwright install --with-deps

      - name: Run Playwright tests
        env:
          BASE_URL: http://localhost:8080/
          CI: true
        run: |
          npx playwright test

      - name: Check password hash after tests
        if: always()
        run: |
          echo "=== Password hash AFTER Playwright tests ==="

          docker exec opencart-db mysql \
            -uopencart \
            -popencart \
            opencart \
            -e "
              SELECT customer_id, email, password
              FROM oc_customer
              WHERE email = 'change.password@test.com';
            "

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results/

      - name: Show Docker logs on failure
        if: failure()
        run: |
          echo "=== OpenCart logs ==="
          docker logs opencart-app

          echo "=== MySQL logs ==="
          docker logs opencart-db

      - name: Stop containers
        if: always()
        run: |
          docker compose down
