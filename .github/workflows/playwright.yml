name: Playwright Tests - Debug

on:
  workflow_dispatch:

  push:

  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      # -----------------------------
      # Checkout
      # -----------------------------

      - name: Checkout repository
        uses: actions/checkout@v4

      # -----------------------------
      # Docker
      # -----------------------------

      - name: Start Docker containers
        run: docker compose up -d --build

      - name: Check Docker containers
        run: docker compose ps

      # -----------------------------
      # MySQL
      # -----------------------------

      - name: Wait for MySQL
        run: |
          echo "Waiting for MySQL..."

          for i in {1..30}; do
            if docker exec opencart-db mysqladmin ping \
              -h localhost \
              -uopencart \
              -popencart \
              --silent; then
              echo "MySQL is ready!"
              exit 0
            fi

            echo "Waiting for MySQL..."
            sleep 5
          done

          echo "MySQL failed to start"
          docker logs opencart-db
          exit 1

      # -----------------------------
      # Database
      # -----------------------------

      - name: Import database
        run: |
          echo "Importing OpenCart database..."

          docker exec -i opencart-db mysql \
            -uopencart \
            -popencart \
            opencart < opencart.sql

          echo "OpenCart database imported!"

      - name: Import test data
        run: |
          echo "Importing test users..."

          docker exec -i opencart-db mysql \
            -uopencart \
            -popencart \
            opencart < test-data.sql

          echo "Test users imported!"

      - name: Verify database
        run: |
          echo "Checking OpenCart database..."

          docker exec opencart-db mysql \
            -uopencart \
            -popencart \
            opencart \
            -e "SHOW TABLES;" | grep oc_store

          echo "Database is ready!"

      - name: Verify test users
        run: |
          echo "Checking test users..."

          docker exec opencart-db mysql \
            -uopencart \
            -popencart \
            opencart \
            -e "
              SELECT customer_id, firstname, lastname, email, date_added
              FROM oc_customer
              WHERE email IN (
                'change1.password@test.com',
                'lock1.test@test.com'
              );
            "

      - name: Reset account lock state
        run: |
          echo "Resetting failed login attempts..."

          docker exec opencart-db mysql \
            -uopencart \
            -popencart \
            opencart \
            -e "
              DELETE FROM oc_customer_login
              WHERE email = 'lock1.test@test.com';
            "

          echo "Account lock state reset!"

      - name: Check password hash before tests
        run: |
          echo "=== Password hash BEFORE Playwright tests ==="

          docker exec opencart-db mysql \
            -uopencart \
            -popencart \
            opencart \
            -e "
              SELECT customer_id, email, password
              FROM oc_customer
              WHERE email = 'change1.password@test.com';
            "

      # -----------------------------
      # OpenCart permissions
      # -----------------------------

      - name: Fix OpenCart permissions
        run: |
          docker exec opencart-app bash -c "
            mkdir -p /var/www/html/system/storage/cache
            mkdir -p /var/www/html/system/storage/logs
            mkdir -p /var/www/html/system/storage/session

            chown -R www-data:www-data /var/www/html/system/storage
            chown -R www-data:www-data /var/www/html/image

            chmod -R 775 /var/www/html/system/storage
            chmod -R 775 /var/www/html/image
          "

      - name: Restart OpenCart
        run: |
          docker restart opencart-app
          sleep 10

      - name: Check OpenCart files
        run: |
          docker exec opencart-app ls -la /var/www/html

      # -----------------------------
      # Wait for OpenCart
      # -----------------------------

      - name: Wait for OpenCart
        run: |
          echo "Waiting for OpenCart..."

          for i in {1..30}; do
            TITLE=$(curl -s http://localhost:8080/ | grep -i "<title>" || true)

            echo "Current title: $TITLE"

            if echo "$TITLE" | grep -qi "Your Store"; then
              echo "OpenCart is ready!"
              exit 0
            fi

            echo "Waiting for OpenCart..."
            sleep 5
          done

          echo "OpenCart failed"

          echo "=== OpenCart logs ==="
          docker logs opencart-app

          exit 1

      # -----------------------------
      # Check Login page
      # -----------------------------

      - name: Check OpenCart Login page
        run: |
          echo "======================================"
          echo "Checking OpenCart Login page"
          echo "======================================"

          echo "=== Login page headers ==="

          curl -I \
            "http://localhost:8080/index.php?route=account/login"

          echo ""
          echo "=== Checking email input ==="

          curl -s \
            "http://localhost:8080/index.php?route=account/login" \
            | grep -E 'input-email'

          echo ""
          echo "=== Checking password input ==="

          curl -s \
            "http://localhost:8080/index.php?route=account/login" \
            | grep -E 'input-password'

          echo ""
          echo "=== Login page is available ==="

      # -----------------------------
      # Node.js
      # -----------------------------

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Check Node and npm versions
        run: |
          node --version
          npm --version

      # -----------------------------
      # Dependencies
      # -----------------------------

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      # -----------------------------
      # Playwright
      # -----------------------------

      - name: Run Playwright tests
        env:
          BASE_URL: http://localhost:8080/
          CI: true
        run: |
          npx playwright test --workers=1

      # -----------------------------
      # Debug database after tests
      # -----------------------------

      - name: Check password hash after tests
        if: always()
        run: |
          echo "=== Password hash AFTER Playwright tests ==="

          docker exec opencart-db mysql \
            -uopencart \
            -popencart \
            opencart \
            -e "
              SELECT customer_id, email, password
              FROM oc_customer
              WHERE email = 'change1.password@test.com';
            "

      # -----------------------------
      # Artifacts
      # -----------------------------

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7

      # -----------------------------
      # Logs on failure
      # -----------------------------

      - name: Show Docker logs on failure
        if: failure()
        run: |
          echo "=== OpenCart logs ==="
          docker logs opencart-app

          echo "=== MySQL logs ==="
          docker logs opencart-db

          echo "=== Docker containers ==="
          docker compose ps

      # -----------------------------
      # Cleanup
      # -----------------------------

      - name: Stop containers
        if: always()
        run: docker compose down